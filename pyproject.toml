[project]
name = "valor-auto-agent"
version = "0.1.0"
description = "portuguese used-car agent: scrapes olx.pt + standvirtual, rates listings 0-10 with a claude sub-agent"
readme = "README.md"
authors = [
    { name = "Daniel Franco", email = "daniel.franco.inbox@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langchain-core>=0.3.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "patchright>=1.49.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "selectolax>=0.3.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI relies on Depends()/Query() in argument defaults by design
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
